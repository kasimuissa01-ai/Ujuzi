<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ececf0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Ujuzi" />
    <title>Ujuzi - Jifunze Kidogo</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      (function() {
        const hostname = window.location.hostname;
        const isAllowedOneSignalDomain = 
          hostname.includes('ujuzii.vercel.app') || 
          hostname.includes('ujuzi.vercel.app');

        if (isAllowedOneSignalDomain) {
          window.OneSignalDeferred = window.OneSignalDeferred || [];
          window.OneSignalDeferred.push(async function(OneSignal) {
            try {
              await OneSignal.init({
                appId: "1780c6e8-a0f3-4cc8-a5e1-a328a231a995",
                safari_web_id: "web.onesignal.auto.01b883ce-5cfa-4aca-8569-bf08de600615",
                serviceWorkerPath: "sw.js",
                notifyButton: {
                  enable: true,
                },
              });
              window.__onesignal_initialized = true;
              console.log("OneSignal initialized successfully on allowed domain.");
            } catch (err) {
              console.warn("OneSignal failed to initialize:", err);
            }
          });
        } else {
          console.log("OneSignal integration is inactive on this domain (" + hostname + "). Supported domain: https://ujuzii.vercel.app");
        }
      })();
    </script>
    <script>
      // Capture the event as early as possible
      window.deferredPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.deferredPrompt = e;
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
